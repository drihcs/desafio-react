<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacote para Gramado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="images/gramado.png" alt="Gramado" class="card-image">
    
    <div class="card-body">
      <div class="badge">9 DIAS / 8 NOITES</div>

      <h2 class="title">Pacotes para Gramado</h2>

      <div class="rating">
        <span class="score">9.4</span>
        <span class="stars">★★★☆☆</span>
      </div>

      <p class="departure">Saindo de São Paulo</p>
      <p class="combo">Hotel + Aéreo</p>

      <div class="discount">Economize R$84</div>

      <div class="price-info">
        <p class="old-price">R$ 1.266</p>
        <p class="new-price">R$ 1.182</p>
        <p class="note">Taxas e impostos não inclusos</p>
      </div>
    </div>
  </div>
</body>
</html>
